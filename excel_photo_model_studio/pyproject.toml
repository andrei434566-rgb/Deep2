[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-photo-model-studio"
version = "0.2.1"
description = "Standalone Excel/photo matching and reviewed YOLO segmentation training"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "PySide6>=6.6",
  "torch>=2.2",
  "ultralytics>=8.3",
  "pytesseract>=0.3.10",
]

[project.scripts]
excel-photo-studio = "excel_photo_model_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
