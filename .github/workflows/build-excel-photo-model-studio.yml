name: Build Excel Photo Model Studio for Windows

on:
  push:
    tags:
      - 'excel-photo-studio-v*'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: excel_photo_model_studio/requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu126
          python -m pip install -r excel_photo_model_studio/requirements.txt pyinstaller
          python -c "import torch; assert torch.version.cuda == '12.6', torch.version.cuda; print('PyTorch:', torch.__version__, 'CUDA build:', torch.version.cuda)"

      - name: Install portable OCR runtime
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          New-Item -ItemType Directory -Force -Path tools/tesseract | Out-Null
          Copy-Item -Path 'C:\Program Files\Tesseract-OCR\*' -Destination tools/tesseract -Recurse -Force
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata' -OutFile tools/tesseract/tessdata/rus.traineddata

      - name: Run application tests
        shell: pwsh
        working-directory: excel_photo_model_studio
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -v

      - name: Build portable application
        working-directory: excel_photo_model_studio
        run: python -m PyInstaller --noconfirm --clean Excel_Photo_Model_Studio.spec

      - name: Verify packaged application
        shell: pwsh
        working-directory: excel_photo_model_studio
        run: |
          $cudaRuntime = Get-ChildItem -LiteralPath 'dist/Excel_Photo_Model_Studio' -Filter '*.dll' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(cublas|cudnn|cufft|curand|cusolver|cusparse|nvrtc|nvjitlink|cudart|c10_cuda|torch_cuda).*\.dll$' }
          if (-not $cudaRuntime) {
            $dllNames = (Get-ChildItem -LiteralPath 'dist/Excel_Photo_Model_Studio' -Filter '*.dll' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name -Unique) -join ', '
            Write-Host "::error title=CUDA runtime verification failed::No expected CUDA DLL names found. Packaged DLLs: $dllNames"
            throw "PyTorch CUDA runtime DLLs were not bundled. DLLs found: $dllNames"
          }
          Write-Host "Verified $($cudaRuntime.Count) CUDA runtime DLL(s): $(($cudaRuntime | Select-Object -ExpandProperty Name -Unique) -join ', ')."

      - name: Run packaged application self-test
        shell: pwsh
        working-directory: excel_photo_model_studio
        run: |
          $process = Start-Process -FilePath 'dist/Excel_Photo_Model_Studio/Excel_Photo_Model_Studio.exe' -ArgumentList 'self-test --output portable-self-test.json' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable application smoke test failed: $($process.ExitCode)" }
          Get-Content portable-self-test.json

      - name: Create split release archives and checksum
        if: startsWith(github.ref, 'refs/tags/excel-photo-studio-v')
        shell: pwsh
        working-directory: excel_photo_model_studio
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^excel-photo-studio-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected release tag: $env:GITHUB_REF_NAME" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $releaseRoot = (Resolve-Path 'release').Path
          $distRoot = (Resolve-Path 'dist/Excel_Photo_Model_Studio').Path
          $files = @(Get-ChildItem -LiteralPath $distRoot -Recurse -File | Sort-Object Length -Descending)
          if ($files.Count -eq 0) { throw 'Portable application folder is empty.' }
          $totalBytes = [int64](($files | Measure-Object Length -Sum).Sum)
          $targetPartBytes = [int64]1200000000
          $partCount = [Math]::Max(1, [int][Math]::Ceiling($totalBytes / $targetPartBytes))
          $partLists = [object[]]::new($partCount)
          for ($index = 0; $index -lt $partCount; $index++) {
            $partLists[$index] = [System.Collections.Generic.List[string]]::new()
          }
          $partSizes = [int64[]]::new($partCount)
          foreach ($file in $files) {
            $target = 0
            for ($index = 1; $index -lt $partCount; $index++) {
              if ($partSizes[$index] -lt $partSizes[$target]) { $target = $index }
            }
            $relative = [System.IO.Path]::GetRelativePath($distRoot, $file.FullName)
            $partLists[$target].Add($relative)
            $partSizes[$target] += $file.Length
          }
          $archivePaths = [System.Collections.Generic.List[string]]::new()
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          Push-Location $distRoot
          try {
            for ($index = 0; $index -lt $partCount; $index++) {
              $number = $index + 1
              $archiveName = 'Excel_Photo_Model_Studio_{0}_Windows_x64_part{1:D2}.zip' -f $version, $number
              $archivePath = Join-Path $releaseRoot $archiveName
              $listPath = Join-Path $env:RUNNER_TEMP "studio-part$number.txt"
              [System.IO.File]::WriteAllLines($listPath, $partLists[$index], $utf8)
              & 'C:\Program Files\7-Zip\7z.exe' a -tzip -mx=1 -scsUTF-8 $archivePath "@$listPath"
              if ($LASTEXITCODE -ne 0) { throw "7-Zip part $number failed with exit code $LASTEXITCODE" }
              $size = (Get-Item -LiteralPath $archivePath).Length
              if ($size -ge 1800000000) { throw "Release part is too large for GitHub: $archiveName ($size bytes)" }
              $archivePaths.Add($archivePath)
            }
          } finally {
            Pop-Location
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entryNames = [System.Collections.Generic.List[string]]::new()
          [int64]$archivedBytes = 0
          foreach ($archivePath in $archivePaths) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
            try {
              foreach ($entry in $archive.Entries) {
                if ($entry.Name) {
                  $entryNames.Add($entry.FullName.Replace('/', '\'))
                  $archivedBytes += $entry.Length
                }
              }
            } finally {
              $archive.Dispose()
            }
          }
          $expectedNames = @($files | ForEach-Object { [System.IO.Path]::GetRelativePath($distRoot, $_.FullName).Replace('/', '\') })
          $expectedSorted = @($expectedNames | Sort-Object)
          $actualSorted = @($entryNames | Sort-Object)
          $duplicates = @($entryNames | Group-Object | Where-Object Count -gt 1)
          if ($entryNames.Count -ne $expectedNames.Count) { throw "Split archive file count mismatch: $($entryNames.Count) != $($expectedNames.Count)" }
          if ($duplicates.Count) { throw 'Split archives contain duplicate file paths.' }
          if (Compare-Object -ReferenceObject $expectedSorted -DifferenceObject $actualSorted) { throw 'Split archives do not contain the exact packaged file paths.' }
          if ($archivedBytes -ne $totalBytes) { throw "Split archive byte coverage mismatch: $archivedBytes != $totalBytes" }
          $hashLines = foreach ($archivePath in $archivePaths) {
            $archiveName = Split-Path -Leaf $archivePath
            $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLower()
            "$hash  $archiveName"
          }
          $hashLines | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Photo-Model-Studio-Windows
          path: |
            excel_photo_model_studio/release/*.zip
            excel_photo_model_studio/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/excel-photo-studio-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Excel Photo Model Studio ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          body_path: excel_photo_model_studio/RELEASE_NOTES_0.6.8.md
          files: |
            excel_photo_model_studio/release/*.zip
            excel_photo_model_studio/release/SHA256SUMS.txt
