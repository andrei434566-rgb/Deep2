name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: >-
          python -m pip install --upgrade pip;
          python -m pip install -r requirements.txt pyinstaller;
          python -m pip install --upgrade --force-reinstall torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu;
          python -c "import torch; print('PyTorch:', torch.__version__, 'CUDA build:', torch.version.cuda)"

      - name: Install portable OCR runtime
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          New-Item -ItemType Directory -Force -Path tools/tesseract | Out-Null
          Copy-Item -Path 'C:\Program Files\Tesseract-OCR\*' -Destination tools/tesseract -Recurse -Force
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata' -OutFile tools/tesseract/tessdata/rus.traineddata

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover

      - name: Build portable Kern Analyzer
        run: python -m PyInstaller --noconfirm --clean Kern_Analyzer.spec

      - name: Remove incompatible ICU DLLs
        shell: pwsh
        run: |
          Remove-Item -LiteralPath dist/Kern_Analyzer/_internal/icuuc.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath dist/Kern_Analyzer/_internal/icudt78.dll -Force -ErrorAction SilentlyContinue

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/Kern_Analyzer/Kern_Analyzer.exe' -ArgumentList '--portable-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable smoke test failed with exit code $($process.ExitCode)" }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Kern_Analyzer-Windows
          path: dist/Kern_Analyzer
          if-no-files-found: error
          retention-days: 30

      - name: Create ZIP for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Kern_Analyzer/* -DestinationPath Kern_Analyzer-Windows.zip -CompressionLevel Optimal
          $size = (Get-Item Kern_Analyzer-Windows.zip).Length
          if ($size -ge 2000000000) { throw "Release ZIP is too large for GitHub: $size bytes" }
          (Get-FileHash Kern_Analyzer-Windows.zip -Algorithm SHA256).Hash.ToLower() + '  Kern_Analyzer-Windows.zip' | Set-Content Kern_Analyzer-Windows.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Kern_Analyzer-Windows.zip
            Kern_Analyzer-Windows.zip.sha256
