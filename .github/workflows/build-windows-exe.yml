name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller

      - name: Build portable DeepCore 2
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name DeepCore_2
          --add-data "models\\best.pt;models"
          --collect-all PySide6
          --collect-all ultralytics
          --collect-all torch
          --collect-all torchvision
          --collect-all cv2
          run.py

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: DeepCore_2-Windows
          path: dist/DeepCore_2
          if-no-files-found: error
          retention-days: 30
