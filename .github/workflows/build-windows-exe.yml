name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller

      - name: Build portable DeepCore 2
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name DeepCore_2
          --paths .
          --add-data "models\\best.pt;models"
          --add-data "app;app"
          --hidden-import app.ui.widgets.workspace_canvas
          --collect-submodules app
          --collect-all PySide6
          --collect-all ultralytics
          --collect-all torch
          --collect-all torchvision
          --collect-all cv2
          run.py

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: DeepCore_2-Windows
          path: dist/DeepCore_2
          if-no-files-found: error
          retention-days: 30

      - name: Create ZIP for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/DeepCore_2/* -DestinationPath DeepCore_2-Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DeepCore_2-Windows.zip
